server:
  port: 8080

spring:
  web:
    error:
      include-message: always   # surface validation reasons (ResponseStatusException) to the UI
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rmbrief}
    username: ${SPRING_DATASOURCE_USERNAME:rm}
    password: ${SPRING_DATASOURCE_PASSWORD:rm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 2000
      timeout: 2000
  cache:
    type: none  # overridden to 'redis' when app.cache.enabled=true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Application-level config — adjust without rebuilding
app:
  cache:
    enabled: false   # set to true to enable Redis response caching
  delta:
    large-outflow-threshold: 5000    # dollars — catches $50k wire + GUSTO PAY, filters card auto-pay noise
    dormancy-days: 90
  agent:
    eager-tool-calls: true   # false = let Claude plan which tools to call
    model: ${AGENT_MODEL:claude-sonnet-5}            # tool planning (only used when eager-tool-calls=false)
  brief:
    model: ${BRIEF_MODEL:claude-sonnet-5}            # pre-meeting brief synthesis
  chat:
    model: ${CHAT_MODEL:claude-sonnet-5}             # chat about a brief (Q&A + proposed edits)
  plaid:
    env: ${PLAID_ENV:sandbox}

  # Post-meeting capture (notes / photos / voice memo / consented recording → reviewed CRM entry)
  capture:
#    model: ${CAPTURE_MODEL:claude-opus-5-5}
    model: ${CAPTURE_MODEL:claude-sonnet-5}
#    model: ${CAPTURE_MODEL:claude-haiku-4-5-20251001} # cheapest
    review-reminder: ${CAPTURE_REVIEW_REMINDER:48h}   # flag captures nobody has reviewed
    retention:
      notes: ${CAPTURE_RETENTION_NOTES:30d}           # raw photos / voice memos
      recording: ${CAPTURE_RETENTION_RECORDING:7d}    # raw client meeting audio — stricter
  media:
    root: ${MEDIA_ROOT:./data/media}
    encryption-key: ${MEDIA_ENCRYPTION_KEY:}          # base64 AES-256 key: openssl rand -base64 32
  transcription:
    provider: ${TRANSCRIPTION_PROVIDER:local-whisper}  # local-whisper | openai
    language: en
    local-whisper:
      url: ${WHISPER_URL:http://localhost:9000}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
  temporal:
    target: ${TEMPORAL_TARGET:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}

  # Every Claude call goes through one client built from these (see AnthropicConfig).
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    api-key-header: ""        # empty = standard x-api-key header
    headers: {}               # extra headers sent on every request

---
# Corporate AI gateway. Activate with SPRING_PROFILES_ACTIVE=gateway.
# The key is sent only in the custom header — never as x-api-key.
spring:
  config:
    activate:
      on-profile: gateway

app:
  anthropic:
    base-url: ${ANTHROPIC_GATEWAY_URL}                  # e.g. https://ai-gateway.example.com/anthropic (SDK appends /v1/messages)
    api-key: ${ANTHROPIC_GATEWAY_API_KEY}
    api-key-header: ${ANTHROPIC_GATEWAY_KEY_HEADER}     # e.g. X-Gateway-Api-Key
    headers: {}
    # headers:                                         # add any static headers your gateway requires
    #   X-App-Id: rm-brief
